# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ THE LUCY LOUNGE — SECURITY GUARDS CI                                       │
# │                                                                             │
# │ DO NOT MODIFY: Governed by /docs/REGRESSION_PACT.md                        │
# │ DO NOT MODIFY: Governed by /docs/PRODUCTION_SPEC_v1.md                     │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# This workflow enforces security rules on every push and PR.
# It blocks merges that violate the REGRESSION_PACT.

name: Security Guards

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: "🔒 GUARD: No hardcoded Supabase keys"
        run: |
          echo "Scanning for hardcoded Supabase keys in frontend code..."
          
          # Pattern matches common key formats (but not env var references)
          # Supabase anon keys start with 'eyJ' (base64 JWT header)
          if grep -rE "['\"](eyJ[A-Za-z0-9_-]{100,})['\"]" \
            --include="*.ts" \
            --include="*.tsx" \
            --include="*.js" \
            --include="*.jsx" \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=.git \
            src/; then
            echo "❌ BLOCKED: Hardcoded JWT keys found in frontend code!"
            echo "Keys must come from environment variables only."
            echo "See /docs/REGRESSION_PACT.md LAW 1"
            exit 1
          fi
          
          echo "✅ No hardcoded keys found"

      - name: "🔒 GUARD: No service_role keys in frontend"
        run: |
          echo "Scanning for service_role key references in frontend code..."
          
          if grep -rE "service_role|SERVICE_ROLE" \
            --include="*.ts" \
            --include="*.tsx" \
            --include="*.js" \
            --include="*.jsx" \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=.git \
            --exclude-dir=supabase/functions \
            src/; then
            echo "❌ BLOCKED: service_role key reference found in frontend!"
            echo "service_role keys are SERVER-ONLY (Edge Functions)."
            echo "See /docs/REGRESSION_PACT.md LAW 2"
            exit 1
          fi
          
          echo "✅ No service_role references in frontend"

      - name: "🔒 GUARD: No secret env vars in frontend"
        run: |
          echo "Scanning for server-only env vars in frontend code..."
          
          FORBIDDEN_VARS="SUPABASE_SERVICE_ROLE_KEY|HUGGINGFACE_API_KEY|ELEVENLABS_API_KEY|LOVABLE_API_KEY|_SECRET|_PRIVATE"
          
          if grep -rE "$FORBIDDEN_VARS" \
            --include="*.ts" \
            --include="*.tsx" \
            --include="*.js" \
            --include="*.jsx" \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=.git \
            --exclude-dir=supabase/functions \
            src/; then
            echo "❌ BLOCKED: Server-only env vars found in frontend!"
            echo "These keys must only be used in Edge Functions."
            echo "See /docs/REGRESSION_PACT.md LAW 2"
            exit 1
          fi
          
          echo "✅ No server secrets in frontend"

      - name: "🔒 GUARD: ErrorBoundary exists"
        run: |
          echo "Verifying RootErrorBoundary is in place..."
          
          if ! grep -q "RootErrorBoundary" src/main.tsx; then
            echo "❌ BLOCKED: RootErrorBoundary not found in main.tsx!"
            echo "The app must be wrapped in RootErrorBoundary."
            echo "See /docs/REGRESSION_PACT.md LAW 5"
            exit 1
          fi
          
          echo "✅ RootErrorBoundary is present"

      - name: "🔒 GUARD: SupabaseGuard exists"
        run: |
          echo "Verifying SupabaseGuard is in place..."
          
          if ! grep -q "SupabaseGuard" src/main.tsx; then
            echo "❌ BLOCKED: SupabaseGuard not found in main.tsx!"
            echo "The app must be wrapped in SupabaseGuard."
            echo "See /docs/REGRESSION_PACT.md LAW 4"
            exit 1
          fi
          
          echo "✅ SupabaseGuard is present"

      - name: "🔒 GUARD: No fallback values"
        run: |
          echo "Scanning for forbidden fallback patterns..."
          
          # This catches patterns like: import.meta.env.VAR || 'hardcoded'
          # But allows: import.meta.env.VAR1 || import.meta.env.VAR2
          if grep -rE "import\.meta\.env\.[A-Z_]+\s*\|\|\s*['\"][^'\"]+['\"]" \
            --include="*.ts" \
            --include="*.tsx" \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=.git \
            src/integrations/supabase/client.ts; then
            echo "❌ BLOCKED: Hardcoded fallback value found in Supabase client!"
            echo "Environment variables must fail-fast, not use fallbacks."
            echo "See /docs/REGRESSION_PACT.md LAW 3"
            exit 1
          fi
          
          echo "✅ No forbidden fallbacks found"

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: security-scan
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Use placeholder values for CI build
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJjaS1wbGFjZWhvbGRlciJ9.placeholder

      - name: "✅ All guards passed"
        run: echo "Security scan and build completed successfully!"
